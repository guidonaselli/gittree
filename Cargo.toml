[workspace]
resolver = "2"
members = [
    "crates/git-process",
    "crates/repo-state",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
notify-debouncer-mini = { version = "0.7", default-features = false }
dirs = "6"
