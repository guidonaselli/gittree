name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GTK/WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Configure Git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"
          git config --global init.defaultBranch master

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend assets
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (performance fixtures)
        run: cargo test -p repo-state --tests -- --ignored

      - name: X11 launch smoke test
        run: |
          cargo build -p gittree
          if xvfb-run --auto-servernum -- timeout 5 ./target/debug/gittree; then
            echo "app unexpectedly exited within 5s" && exit 1
          else
            status=$?
            if [ $status -ne 124 ]; then
              echo "app exited with unexpected code $status" && exit 1
            fi
            echo "app successfully ran for 5s window without crashing"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: token lint
        run: pnpm lint:tokens

      - name: typecheck
        run: pnpm exec tsc -b

      - name: unit tests
        run: pnpm test

      - name: build
        run: pnpm build
